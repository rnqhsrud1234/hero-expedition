<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<title>영웅원정기 · Phaser</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
  <script type="module" crossorigin src="./assets/index-fR6RNnil.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/phaser-DXXWZowi.js">
  <link rel="stylesheet" crossorigin href="./assets/index-BdMjelUf.css">
</head>
<body>
<div id="bootStatus" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0a1118;color:#dceeff;font:700 18px Arial,sans-serif;text-align:center;padding:24px">게임 불러오는 중...</div>

<div id="phaser-root"></div><div id="runtimeStatus" role="status"></div><div id="fatalError" hidden></div><div id="rotateHint">가로 화면으로 돌리면 더 편하게 플레이할 수 있습니다.</div><canvas id="game"></canvas>
<canvas id="minimap" width="180" height="118" aria-label="미니맵"></canvas>
<div id="hud">
  <div class="topbar">
    <div class="leftInfo">
      <div id="stage" class="stage">1-1 · 폭풍 유적</div>
      <div id="roomName" class="roomName">시작방</div>
      <div class="hpWrap"><div id="hpFill" class="hpFill"></div><div id="hpTxt" class="hpTxt">120 / 120</div></div>
      <div class="subInfo"><span id="coinTxt">코인 0</span><span id="roomCount">던전 1/5</span><span id="equipTxt">장비 0/3</span></div>
    </div>
    <div class="topActions">
      <button id="inventoryBtn" class="topBtn inventoryBtn" aria-label="아이템창">가방 <span id="bagCount">0</span></button>
      <button id="pause" class="topBtn pause" aria-label="일시정지">Ⅱ</button>
    </div>
  </div>
  <div id="bossHud" class="bossHud"><div id="bossName" class="bossName">폭풍 골렘</div><div class="bossBar"><div id="bossFill" class="bossFill"></div></div></div>
  <div id="toast"></div>
  <div id="joy" class="joystick"><div class="joyRing"></div><div id="knob" class="knob"></div></div>
  <div class="actions">
    <button id="interact" class="actionBtn interact" aria-label="상호작용"><span id="interactText">줍기</span><small id="interactSub"></small></button>
    <button id="skill" class="actionBtn skill"><span>낙뢰</span><span id="skillCd" class="cd">READY</span></button>
    <button id="attack" class="actionBtn attack">전격탄</button>
  </div>
</div>
<div id="upgrade" class="overlay"><div class="panel"><h2>영웅 강화</h2><div class="subtitle">던전 보상을 선택하세요. 선택 후 다음 구역으로 진행합니다.</div><div id="choices" class="choices"></div><div id="buildSummary" class="summary"></div></div></div>
<div id="inventoryOverlay" class="overlay"><div class="panel inventoryPanel">
  <div class="inventoryHead"><h2><small>LOADOUT</small>장비</h2><button id="inventoryClose" class="closeBtn">×</button></div>
  <div id="equipSlots" class="equipSlots"></div>
  <div class="inventoryBody">
    <section class="inventoryListPane">
      <div class="inventoryToolbar"><div class="inventorySectionTitle">보유 장비 <span id="inventoryCount"></span></div><div class="inventoryFilters"><button type="button" data-filter="all" class="active">전체</button><button type="button" data-filter="weapon">무기</button><button type="button" data-filter="armor">방어구</button><button type="button" data-filter="accessory">장신구</button></div></div>
      <div id="inventoryList" class="inventoryGrid"></div>
    </section>
    <section id="itemDetail" class="itemDetail"><div class="emptyDetail">왼쪽에서 장비를 선택하세요.</div></section>
  </div>
</div></div>
<div id="pauseOverlay" class="overlay"><div class="panel pauseMenu"><h2>일시정지</h2><div id="pauseBuild" class="summary"></div><button id="resume" class="primary">계속하기</button><button id="restart" class="secondary">새 스테이지 시작</button></div></div>
<div id="bossConfirm" class="overlay"><div class="panel confirmPanel"><h2>스테이지 보스</h2><div class="subtitle bossWarning">보스방에 입장하면 현재 1-5 던전 탐색이 종료됩니다.<br>남은 보물방이나 이벤트방을 더 확인한 뒤 입장해도 됩니다.</div><button id="bossEnter" class="primary">보스방 입장</button><button id="bossCancel" class="secondary">더 탐험하기</button></div></div>
<div id="end" class="overlay"><div class="panel"><h2 id="endTitle"></h2><div id="endDesc" class="subtitle"></div><div id="endStats" class="summary"></div><button id="again" class="primary">새 스테이지 도전</button></div></div>
</body>
</html>
