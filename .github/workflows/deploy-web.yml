name: Deploy Hero Expedition WEB ZIP

on:
  push:
    branches: [main]
    paths:
      - 'Hero-Expedition-Phaser-2.0.0-alpha.1-WEB.zip.part-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and unpack WEB zip
        shell: bash
        run: |
          set -e

          PART_PREFIX="Hero-Expedition-Phaser-2.0.0-alpha.1-WEB.zip.part-"

          cat ${PART_PREFIX}* > /tmp/hero-web.zip

          rm -rf /tmp/hero-web
          mkdir -p /tmp/hero-web
          unzip -q -o /tmp/hero-web.zip -d /tmp/hero-web

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'Hero-Expedition-Phaser-2.0.0-alpha.1-WEB.zip.part-*' \
            -exec rm -rf {} +

          cp -a /tmp/hero-web/. .

      - name: Commit unpacked web build
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Deploy Phaser 2.0.0 alpha.1 WEB"
          git push origin main
